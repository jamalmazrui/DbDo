name = dbdo
summary = "DbDo Keyboard Pass-Through"
description = """Lets DbDo handle its own table-style chords (Alt+Control with arrows, Home, End, PageUp, PageDown, NumPad5), search chords (Control+F, Control+J, Control+F3 plus Shift variants), parent-child drill chords (Alt with arrows, Home, End), and Alt-letter command shortcuts instead of NVDA intercepting them with its own table-navigation, browse-mode, or system commands. Mirrors what the DbDo.jkm key map does for JAWS. In the grid it also passes Up and Down Arrow and Page Up and Page Down to DbDo, which reads each row itself. Without this add-on NVDA reports 'Not in a table' or runs an unrelated default command when you press Alt+Control+arrow inside DbDo."""
author = "Jamal Mazrui"
url = https://github.com/JamalMazrui/DbDo
version = 1.1.0
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.1
updateChannel = None
